#
# The CitrineOS environment: what `ocpp-tck run-all` needs on the other end of
# the wire when CSMS_DRIVER=./drivers/citrineos/index.ts. Not a production
# deployment -- the message API is unauthenticated here (CitrineOS's shipped
# defaults select the local-bypass auth provider), and the credentials below
# are the driver's documented defaults, in the clear, on purpose.
#
# Every name in this file is load-bearing, because the driver's defaults
# (drivers/citrineos/config.ts defaultCitrineConfig) resolve to them:
#
#   name: citrineos + network citrineos-internal -> CITRINE_NETWORK=citrineos_citrineos-internal
#   service name citrine                         -> the DNS name in CITRINE_WS_URL=ws://citrine:8081/
#   graphql-engine's published port 8090         -> CITRINE_GRAPHQL_URL=http://localhost:8090
#
# Two service names are load-bearing for CITRINEOS rather than for the driver:
# the database host and the broker URL are handed to the server through
# CITRINEOS_DATABASE_HOST and CITRINEOS_MESSAGEBROKER_AMQP_URL below, so
# renaming `ocpp-db` or `amqp-broker` means moving both the service and the
# value in the same edit.
#
# The project name is pinned here rather than inherited from the directory, so
# that `docker compose -f drivers/citrineos/compose.yaml up` produces the same
# network name as `docker compose -p citrineos ...` and as CI.
#
# TCK_SUFFIX makes this stack repeatable on one docker daemon. Everything below
# that the daemon holds in a GLOBAL namespace takes it: the project name (hence
# the network and the volumes), the four container names, and the two published
# ports. Empty by default, so a single stack is byte-for-byte what it was.
#
# Set it, and CITRINE_NETWORK with it -- see README.md. Two workspaces of this
# repository share one daemon, and nothing warns you: the second `up` adopts the
# first one's containers, and a `down -v` destroys a database somebody else is
# mid-sweep against.
name: citrineos${TCK_SUFFIX:-}

# Derived from citrineos-core's own docker-compose.yml @ v2.0.0-beta4
# (Apache-2.0). Modified: the operator UI, the OCPI server and the mock MSP
# are dropped; minio is dropped because fileAccess.type defaults to `local`,
# so nothing reaches S3; every volume is dropped; images are pinned by digest;
# only the HTTP API and GraphQL ports are published, on loopback; the two
# certificate-authority integrations upstream opts into are left off (see the
# environment block). The Hasura sidecar is KEPT -- upstream starts it ungated,
# and it is how this driver reads and seeds (see records.ts).
services:
  # Images are pinned by digest, not tag: `latest` is republished on every
  # build, and a conformance run that cannot say which bytes it tested is not a
  # conformance run. Same discipline as DEFAULT_SIM_IMAGE in tck/sim.ts and as
  # drivers/steve/compose.yaml.
  #
  # A v2 prerelease rather than the v1.9.1 stable, deliberately: the OCPP 1.6
  # GetLocalListVersion and SendLocalList message endpoints exist only from the
  # v2 line (packages/ocpp/src/apis/ocpp/1.6/ev-driver.ts at this tag), and six
  # scenarios need them. See drivers/citrineos/README.md for the v1.9.1 variant
  # and what it costs.
  #
  # beta4 rather than beta3, and it is four findings closing rather than a
  # tidy-up: citrineos-core#890 answers an OCPP 1.6 FirmwareStatusNotification
  # with the .conf OCA TC_044 requires instead of a NotSupported CALLERROR,
  # citrineos-core#907 maps a stored `Blocked` idTag to `Blocked` on Authorize
  # instead of `Invalid` (TC_023.3), and citrineos-core#846 stops a failed
  # message-audit insert from killing the process. Every one of those was a
  # declared expected failure or a gap-table row; see README.md's gap table for
  # what remains. beta3 before it was citrineos-core#830, the correlation
  # trigger whose foreign-key violation killed the dispatcher mid-sweep.
  #
  # Re-pin with:
  #   T=$(curl -sS "https://ghcr.io/token?scope=repository:citrineos/citrineos-server:pull&service=ghcr.io" \
  #        | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
  #   curl -sSI -H "Authorization: Bearer $T" \
  #     -H "Accept: application/vnd.oci.image.index.v1+json" \
  #     https://ghcr.io/v2/citrineos/citrineos-server/manifests/v2.0.0-beta4 \
  #     | grep -i docker-content-digest
  citrine:
    image: ghcr.io/citrineos/citrineos-server:v2.0.0-beta4@sha256:e33badb992d7b7fd28a8d1ac0d0ee6f10817f34f2647db168603424102eeb7c2
    container_name: citrine${TCK_SUFFIX:-}
    restart: unless-stopped
    depends_on:
      ocpp-db:
        condition: service_healthy
      amqp-broker:
        condition: service_healthy
    environment:
      # Which process this container runs: router + every module + the APIs.
      APP_NAME: "all"
      # Read by entrypoint.sh before the config loader exists.
      DB_STRATEGY: "migrate"
      # Everything else is a SystemConfig override, CITRINEOS_<PATH> over the
      # schema in packages/types/src/config/types.ts -- one underscore per
      # level, a camelCase field stays one segment, values JSON-parsed. The
      # schema defaults are the local-dev values, so only what differs inside
      # a container is listed. From beta4; the `docker` app-env and the
      # BOOTSTRAP_CITRINEOS_* names this replaced no longer exist.
      CITRINEOS_HOST: "0.0.0.0"
      CITRINEOS_DATABASE_HOST: "ocpp-db"
      CITRINEOS_MESSAGEBROKER_AMQP_URL: "amqp://guest:guest@amqp-broker:5672"
      # The fileAccess root, and the one value here that is not optional: the
      # websocket servers (8081 plaintext, 8082 basic-auth, 8443/8444 TLS) are
      # read from websocket-servers.json RELATIVE TO IT, so a root that does
      # not hold that file is a server with an HTTP API and no OCPP listener.
      # It is spelled from the repository root because that is the working
      # directory entrypoint.sh runs `node` from in the image. Local disk, not
      # S3, is the default, which is why there is no minio service here.
      CITRINEOS_FILEACCESS_LOCAL_DEFAULTFILEPATH: "apps/ocpp-server/src/assets"
      # The Swagger logo is the one path read straight from the working
      # directory rather than through fileAccess, so it needs the full prefix.
      CITRINEOS_SWAGGER_LOGOPATH: "apps/ocpp-server/src/assets/logo.png"
      # NOT set, on purpose: CITRINEOS_INTEGRATIONS_V2GCA and
      # CITRINEOS_INTEGRATIONS_CHARGINGSTATIONCA. Upstream's compose turns both
      # on, which points the server at Hubject's test PKI and Let's Encrypt
      # staging. Nothing here asks the CSMS to sign a certificate -- the
      # scenarios send InstallCertificate, whose handler never touches the CA
      # service -- and a conformance stack should not reach the internet on
      # its own. auth.localBypass defaults to true, so the message API stays
      # unauthenticated without being asked to; that is what the header means
      # by "the shipped defaults".
    ports:
      # Published because the driver runs on the HOST (it reaches Postgres via
      # `docker exec`), so its CITRINE_API_URL is http://localhost:8080 while
      # the simulator container, on citrineos-internal, uses ws://citrine:8081/ .
      # That asymmetry is why CITRINE_API_URL and CITRINE_WS_URL are separate
      # settings.
      #
      # Loopback only, and 8080 only: the OCPP endpoints (8081 plaintext, 8082
      # basic-auth, 8443/8444 TLS) are reached by the simulator over the
      # internal network, and 8080 carries an API that accepts every request
      # unauthenticated.
      - "127.0.0.1:${CITRINE_API_PORT:-8080}:8080"
    networks:
      - citrineos-internal
    healthcheck:
      # `node -e` rather than curl: curl is not in this image. Verbatim from
      # upstream's compose, which is the only reason it is this baroque.
      test:
        [
          "CMD-SHELL",
          "node -e \"const net = require('net'); const c = net.createConnection(8080, '127.0.0.1', () => { c.end(); process.exit(0); }); c.on('error', () => process.exit(1)); c.setTimeout(5000, () => { c.destroy(); process.exit(1); });\"",
        ]
      interval: 5s
      timeout: 10s
      retries: 40
      # A cold first boot runs the whole migration set before the port opens.
      start_period: 120s

  ocpp-db:
    image: postgis/postgis:16-3.5@sha256:4e07b425403ba55c20b541884db2e80c686dd6476bf9265046ac9c163895605d
    container_name: citrine-db${TCK_SUFFIX:-}
    restart: unless-stopped
    # Upstream pins this because postgis publishes no arm64 tag; without it,
    # `up` fails outright on an Apple Silicon host rather than falling back.
    platform: linux/amd64
    environment:
      POSTGRES_DB: citrine
      POSTGRES_USER: citrine
      POSTGRES_PASSWORD: citrine
    networks:
      - citrineos-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U citrine -d citrine"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s

  # The data API. CitrineOS's own compose runs this sidecar UNGATED, while
  # putting the operator UI and the OCPI server behind `profiles:` -- and its
  # shipped `packages/ocpi-base` writes Authorizations through it. So this is
  # the vendor's data path, not a developer convenience, which is why the
  # driver reads and seeds through it instead of reaching into Postgres.
  #
  # Upstream mounts `apps/ocpp-server/hasura-metadata` and uses the
  # `.cli-migrations-v3` image to apply it at boot. This one does not: nothing
  # is tracked at startup, and `ocpp-tck driver provision` tracks the tables
  # and relationships it needs through the metadata API. Vendoring their
  # metadata would pin a second schema-shaped artifact that nothing here reads.
  #
  # No admin secret, matching the message API's posture and upstream's own
  # compose. CITRINE_HASURA_SECRET exists for a deployment that sets one.
  graphql-engine:
    image: hasura/graphql-engine:v2.40.3@sha256:679fb764590e848e59ab6b82b3e906cc46f87d776f869f49132ca728660df244
    container_name: citrine-graphql${TCK_SUFFIX:-}
    restart: unless-stopped
    depends_on:
      ocpp-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CITRINE_GRAPHQL_PORT:-8090}:8080"
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://citrine:citrine@ocpp-db:5432/citrine
      HASURA_GRAPHQL_ENABLE_TELEMETRY: "false"
    networks:
      - citrineos-internal
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  amqp-broker:
    image: rabbitmq:3-management@sha256:e582c0bc7766f3342496d8485efb5a1df782b5ce3886ad017e2eaae442311f69
    container_name: citrine-amqp${TCK_SUFFIX:-}
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: "guest"
      RABBITMQ_DEFAULT_PASS: "guest"
    networks:
      - citrineos-internal
    healthcheck:
      test: rabbitmq-diagnostics -q check_port_connectivity
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 20s

# No volume: every run starts from an empty schema and re-provisions. State
# that survives a run is state a scenario can accidentally depend on.
networks:
  citrineos-internal:
    driver: bridge
