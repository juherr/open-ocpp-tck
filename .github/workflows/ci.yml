name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # One declaration for both jobs. Two literals let a bump land on the offline
  # checks while the e2e sweep quietly keeps running the old runtime.
  BUN_VERSION: "1.3.14"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Neither job pushes anything, so the token has no reason to stay
          # in .git/config where every later step -- install scripts, the
          # sweep, the containers it spawns -- could read it.
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned, not "latest": the declaration output and the container the
          # extractors run in are both version-sensitive, and a silent bun bump
          # would show up as an unexplained types/ or artifact diff.
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run typecheck

      - name: Committed declarations match the sources
        run: bash tests/types-current.sh

      # Offline: reads the driver module and the scenario registry, nothing
      # else. No CSMS, no container, no credentials.
      - name: SteVe driver agrees with the core
        run: bun run check:steve-driver

      # The same check for the second driver, and it earns its place: this is
      # the one whose scope table has NOT_APPLICABLE rows, so it is the only
      # place where adding or renaming a scenario silently stops being covered.
      - name: CitrineOS driver agrees with the core
        run: bun run check:citrineos-driver

      - name: Core names no CSMS
        run: bash tests/generic-core.sh

      - name: Vendored files match VENDOR.md
        run: bash tests/vendor-integrity.sh

      # Docker-backed: the extractors run in the pinned bun image, with the
      # repository mounted read-only.
      - name: Scenario assertions and CSMS call sequences unchanged
        run: bash tests/spec-invariants.sh

      - name: Shell guards lint clean
        run: shellcheck tests/*.sh tools/*.sh

  # Everything above is offline and proves the drivers type-check. The two e2e
  # jobs prove they work: real containers, real OCPP-J frames. They are peers,
  # and each answers a question the other cannot -- see e2e-citrineos below.
  #
  # This one: SteVe is the CSMS the 47 scenarios were originally written
  # against, so it is where a capability the harness LOST shows up first. Its
  # scope table claims every scenario; a row that had to be demoted would mean
  # the core dropped something. Without this job that can rot green unnoticed.
  e2e-steve:
    runs-on: ubuntu-latest
    needs: check
    # ~10 min of sweep plus image pull, a cold SteVe boot and the one-off
    # provisioning restart. Generous, but far below the 6h default: a wedged
    # simulator container should fail the build, not occupy a runner all day.
    timeout-minutes: 45
    env:
      CSMS_DRIVER: ./drivers/steve/index.ts
      # localhost, not the compose service name: the runner reaches SteVe
      # through the published port, while the simulator containers reach it by
      # service name from inside the network.
      STEVE_URL: http://localhost:8180/steve/manager
      OCPP_CP_IDS: CERTCP1,CERTCP2,CERTCP3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Neither job pushes anything, so the token has no reason to stay
          # in .git/config where every later step -- install scripts, the
          # sweep, the containers it spawns -- could read it.
          persist-credentials: false

      # Started before the toolchain, and deliberately without --wait: pulling
      # two pinned images and cold-booting SteVe (its healthcheck allows 150s
      # for Flyway) shares nothing with installing bun, so the two may as well
      # overlap. The blocking wait below is then usually already satisfied.
      - name: Start SteVe
        run: docker compose -f drivers/steve/compose.yaml up -d

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Wait for it to be healthy
        run: docker compose -f drivers/steve/compose.yaml up -d --wait

      - name: Seed the fixtures the scenarios assume
        run: bun bin/ocpp-tck.ts driver provision

      # provision self-verifies, so this cannot realistically go red on its own.
      # It is here to exercise the `verify` verb itself -- the one a user runs
      # when a sweep fails and they need to know whether to blame the CSMS or
      # the fixtures. A verb nothing runs is a verb that rots.
      - name: Environment matches the scenarios
        run: bun bin/ocpp-tck.ts driver verify

      # The whole sweep, on every event -- pull requests included.
      #
      # An earlier draft ran only --group core on PRs to save time. Measured,
      # that trade is bad: these scenarios are dominated by fixed waits
      # (bootWaitSecs + holdSecs), not by CPU, so the cost is predictable and
      # barely moves with runner speed. Across 3 lanes, core is ~3 min and all
      # 44 are ~10 min. Roughly 7 minutes buys back the 29 scenarios that core
      # leaves out -- on precisely the branch where a regression is introduced,
      # and for a job whose entire reason to exist is that this driver cannot
      # rot green. Cheap coverage is not worth a stale signal.
      #
      # --retry-failed-isolated is not optional here: the runner warns that
      # parallel lanes are not fully isolated, so a bare --parallel turns
      # cross-lane interference into a red build. The retry re-runs only the
      # failures, sequentially, which is the mode the runner calls reliable.
      # `bun run e2e`, not the two commands spelled out here. A full sweep is
      # two invocations -- `all` is 44 scenarios and the authorize group
      # (TC_023) sits outside it, see TODO(upstream) at the GROUPS registry in
      # tck/main.ts -- and that fact used to live only in this file. Anyone
      # running `run-all` by hand got 44/47 and read "no failures", missing
      # exactly the three scenarios that prove `driver provision` seeded
      # anything. One script means CI and a human run the same thing.
      - name: Conformance sweep
        run: bun run e2e

      # always(): the wire logs are worth most precisely when the sweep failed.
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ocpp-tck-results-${{ github.run_id }}
          path: results/
          if-no-files-found: warn

      - name: Tear down
        if: always()
        run: docker compose -f drivers/steve/compose.yaml down -v

  # The peer of the job above, answering the question it cannot: CitrineOS had
  # no part in writing the scenarios, so this is where the core would be caught
  # quietly re-acquiring a dependency on how SteVe happens to behave. A
  # CSMS-neutrality claim that only one CSMS ever exercises is a claim, not a
  # check.
  #
  # continue-on-error, and NOT because the job is unreliable: it is expected to
  # be red. Two of the 47 scenarios fail against the pinned CitrineOS, and both
  # are kept red deliberately rather than demoted in the scope table --
  # tck/scope.ts forbids demoting a row to make a red scenario go away, and
  # these are findings about CitrineOS:
  #
  #   cert16-tc023-3-authorize-blocked   deterministic (3 runs of 3): CitrineOS
  #                                      answers Invalid where OCPP 1.6 requires
  #                                      Blocked.
  #   cert16-tc044-2-firmware-download-failed
  #                                      flaky (1 pass in 3), thinnest timing
  #                                      margin of any scenario.
  #
  # So this job's value is the OTHER 45, and the artifact it uploads. Turn it
  # blocking only once both rows are green -- i.e. once upstream fixes the
  # Blocked mapping -- and not merely because it has been quiet for a while.
  # drivers/citrineos/README.md carries the full gap table.
  e2e-citrineos:
    runs-on: ubuntu-latest
    needs: check
    continue-on-error: true
    timeout-minutes: 45
    env:
      CSMS_DRIVER: ./drivers/citrineos/index.ts
      # localhost, not the compose service name -- same asymmetry as the SteVe
      # job: the runner reaches the message API through the published port,
      # while the simulator containers reach the OCPP endpoint by service name
      # from inside the network.
      CITRINE_API_URL: http://localhost:8080
      OCPP_CP_IDS: CERTCP1,CERTCP2,CERTCP3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Before the toolchain and without --wait, for the same reason as the
      # SteVe job: pulling the images and running the migrations on a cold
      # database shares nothing with installing bun.
      - name: Start CitrineOS
        run: docker compose -f drivers/citrineos/compose.yaml up -d

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Wait for it to be healthy
        run: docker compose -f drivers/citrineos/compose.yaml up -d --wait

      - name: Seed the fixtures the scenarios assume
        run: bun bin/ocpp-tck.ts driver provision

      # Same reasoning as the SteVe job: a verb nothing runs is a verb that rots.
      - name: Environment matches the scenarios
        run: bun bin/ocpp-tck.ts driver verify

      # `bun run e2e`, exactly as the SteVe job runs it -- both sweeps, one
      # script, so the two jobs cannot drift apart and neither can drift from
      # what a human runs by hand. Seven scenarios are NOT APPLICABLE here and
      # never start a container, so this is cheaper than SteVe's rather than
      # doubling the bill.
      - name: Conformance sweep
        run: bun run e2e

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ocpp-tck-citrineos-results-${{ github.run_id }}
          path: results/
          if-no-files-found: warn

      - name: Tear down
        if: always()
        run: docker compose -f drivers/citrineos/compose.yaml down -v
