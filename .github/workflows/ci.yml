name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # One declaration for both jobs. Two literals let a bump land on the offline
  # checks while the e2e sweep quietly keeps running the old runtime.
  BUN_VERSION: "1.3.14"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Neither job pushes anything, so the token has no reason to stay
          # in .git/config where every later step -- install scripts, the
          # sweep, the containers it spawns -- could read it.
          persist-credentials: false
          # tests/documented-install-ref.sh resolves the tag the documentation
          # cites out of the object database, so this job -- and only this job
          # -- needs the tags. Without them it fails on "no such tag" whatever
          # the documentation says, which is a failed lookup wearing a guard's
          # clothes: the shape 68d3458 fixed elsewhere.
          #
          # BOTH options, and the depth is not redundant. `fetch-tags` alone
          # only stops checkout passing `--no-tags`; what remains is git's tag
          # auto-following, and a `--depth=1` fetch of a single pull-request
          # ref follows nothing, because the tag points at a commit on main
          # that the fetch never downloads. Measured on this repository's own
          # CI, not assumed -- the first attempt shipped `fetch-tags` at depth
          # 1 and the fetch command carried no `--tags` at all.
          fetch-depth: 0
          fetch-tags: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned, not "latest": the declaration output and the container the
          # extractors run in are both version-sensitive, and a silent bun bump
          # would show up as an unexplained types/ or artifact diff.
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run typecheck

      - name: Committed declarations match the sources
        run: bash tests/types-current.sh

      # Offline: reads the driver module and the scenario registry, nothing
      # else. No CSMS, no container, no credentials.
      - name: SteVe driver agrees with the core
        run: bun run check:driver:steve

      # The same check for the second driver, and it earns its place: this is
      # the one whose scope table has NOT_APPLICABLE rows, so it is the only
      # place where adding or renaming a scenario silently stops being covered.
      - name: CitrineOS driver agrees with the core
        run: bun run check:driver:citrineos

      # And its OTHER table. `scope` is a function of the environment, so this
      # driver declares two of them; the v1 one is derived from the v2 one and
      # was previously never checked anywhere -- a v2 row renamed in tandem
      # with its v1 counterpart type-checks and covers nothing.
      - name: CitrineOS driver agrees with the core on the v1 line
        run: bun run check:driver:citrineos-v1

      # In-process, because the CLI can only ever pass process.env: that a
      # driver's declarations follow the env they are RESOLVED with, not the
      # one that happened to exist at import, is unreachable from a shell.
      - name: Driver scope follows the environment
        run: bun tests/driver-env-scope.ts

      # In-process for the same reason: the rule that decides whether a red
      # sweep ends the build is not reachable from a shell without running a
      # scenario, and the rows that matter would each need a CSMS engineered to
      # fail a chosen way.
      - name: Exit-code rule holds
        run: bun tests/expected-failure-standing.ts

      # A CALLERROR fails, a truncated log does not. In `tools/verify.sh` and
      # `bun run test` since it was written; it was missing here, which meant
      # CI linted it and never ran it.
      - name: A CALLERROR fails, a truncated log does not
        run: bun tests/assert-answered.ts

      # In-process for the same reason, in its most literal form: both bundled
      # drivers spell an unfiltered GetConfiguration `{"key":[]}`, so the
      # encoding TC_019_1 used to reject -- an omitted member -- is not
      # reachable from any sweep, offline or live. Only from the frames.
      - name: An unfiltered GetConfiguration is a shape, not a spelling
        run: bun tests/get-configuration-filter.ts

      # In-process because the refusal it guards reads `docker ps`: a shell
      # version would start a container per row on the daemon this repository's
      # own sweeps share, to check the rule that keeps two sweeps apart.
      - name: The foreign-sweep refusal sees every namespace
        run: bun tests/foreign-sweep-scope.ts

      # In-process because `buildDockerArgs` is pure and its only caller spawns
      # docker in the next statement: the argv a scenario would run is not
      # printable from a shell, and neither is a resolution from an environment
      # that is not this process's.
      - name: The simulator argv says what the run was asked to do
        run: bun tests/sim-docker-argv.ts

      # In-process because every refusal it pins needs a trace no run produces:
      # across 94 archived scenarios and 1576 records not one record is missing
      # a member, and both bundled drivers ride the same producer, so the only
      # way into those branches is handing the mapper its records.
      - name: The wire trace reads as the frames the log would have given
        run: bun tests/trace-frames.ts

      - name: Core names no CSMS
        run: bash tests/generic-core.sh

      # The e2e job's red-row trigger, held to what it claims from this job --
      # which is the point of it having become a file. As a `grep` in that
      # job's YAML it was reachable only by running a sweep and reading the log.
      - name: A red row is red whatever its namespace
        run: bash tests/summary-red-rows.sh

      # The other layering boundary: nothing outside the harness layer may
      # cite the harness overlay.
      - name: Harness layering holds
        run: bash tests/harness-layer.sh

      # This job, tools/verify.sh and `bun run test` are three copies of one
      # list. Kept in step by hand, they drifted three times -- always the same
      # way, a guard added to the other two and linted here without ever being
      # run.
      - name: Gate parity holds
        run: bash tests/gate-parity.sh

      # The numbers AGENTS.md writes out in prose, against what is there.
      # Three were wrong at once, and none was caught by reading.
      - name: Doc counts hold
        run: bash tests/doc-counts.sh

      # The documented install command, against what it installs. Reads the
      # tag out of the object database, which is why this job checks out with
      # fetch-tags: without them `git rev-parse` fails and the guard would be
      # red for a reason that has nothing to do with the documentation.
      - name: Documented install ref resolves
        run: bash tests/documented-install-ref.sh

      # The only script here that rewrites VENDOR.md and patches/, exercised
      # in a throwaway git repository. Before vendor-integrity, which reads
      # the manifest this proves it will not corrupt.
      - name: Re-pin refuses what it promises to
        run: bash tests/repin-refusals.sh

      - name: Vendored files match VENDOR.md
        run: bash tests/vendor-integrity.sh

      # Docker-backed: the extractors run in the pinned bun image, with the
      # repository mounted read-only.
      - name: Scenario assertions and CSMS call sequences unchanged
        run: bash tests/spec-invariants.sh

      # After spec-invariants, for the reason tools/verify.sh gives: this reads
      # the artifact that one regenerates, so a stale inventory should be
      # reported as stale rather than as a coverage hole.
      - name: Every OCA obligation has a check
        run: bash tests/oca-obligations.sh

      - name: Shell guards lint clean
        run: shellcheck tests/*.sh tools/*.sh

  # Everything above is offline and proves the drivers type-check. This job
  # proves they WORK: real containers, real OCPP-J frames. It runs once per
  # bundled driver, and the two lanes are peers -- each answers a question the
  # other cannot.
  #
  # SteVe is the CSMS the 47 scenarios were originally written against, so it
  # is where a capability the harness LOST shows up first. Its scope table
  # claims every scenario; a row that had to be demoted would mean the core
  # dropped something. Without this lane that can rot green unnoticed.
  #
  # CitrineOS had no part in writing the scenarios, so it is where the core
  # would be caught quietly re-acquiring a dependency on how SteVe happens to
  # behave. A CSMS-neutrality claim that only one CSMS ever exercises is a
  # claim, not a check. It carries one known finding, and carries it in the
  # open: cert16-tc023-3-authorize-blocked fails deterministically (3 runs of
  # 3) because CitrineOS answers Invalid where OCPP 1.6 requires Blocked. The
  # row is kept red rather than demoted in the scope table, which tck/scope.ts
  # forbids, and it is DECLARED in drivers/citrineos/expected.ts -- so the
  # sweep reports it as EXPECTED FAIL and exits 0, a NEW red still fails the
  # build, and the day upstream fixes the mapping that row fails as UNEXPECTED
  # PASS until its entry is deleted. drivers/citrineos/README.md carries the
  # full gap table.
  #
  # ONE JOB RATHER THAN TWO NEAR-IDENTICAL COPIES, and it is only legal because
  # both lanes are blocking: a matrix carries one continue-on-error for the
  # whole strategy, so the arrangement this replaced -- one lane muted, one not
  # -- could not have been written here at all.
  e2e:
    runs-on: ubuntu-latest
    needs: check
    strategy:
      # NOT the default, and not a preference. fail-fast cancels the sibling on
      # the first failure, which would destroy the exact property the two
      # paragraphs above describe: each lane answers a question the other
      # cannot, and a cancelled lane is a missing answer rather than a saved
      # minute.
      fail-fast: false
      matrix:
        driver: [steve, citrineos]
    # ~10 min of sweep plus image pull, a cold CSMS boot and -- for SteVe --
    # the one-off provisioning restart. Generous, but far below the 6h default:
    # a wedged simulator container should fail the build, not occupy a runner
    # all day.
    timeout-minutes: 45
    env:
      CSMS_DRIVER: ./drivers/${{ matrix.driver }}/index.ts
      OCPP_CP_IDS: CERTCP1,CERTCP2,CERTCP3
      # localhost, not the compose service name: the runner reaches the CSMS
      # through the published port, while the simulator containers reach it by
      # service name from inside the network. That asymmetry is why each driver
      # has a separate setting for the two.
      #
      # Both are set in both lanes. Each driver reads only its own, so the
      # unused one is inert, and spelling them out here beats a
      # matrix.include that hides which settings exist at all.
      STEVE_URL: http://localhost:8180/steve/manager
      CITRINE_API_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # This job pushes nothing, so the token has no reason to stay in
          # .git/config where every later step -- install scripts, the sweep,
          # the containers it spawns -- could read it.
          persist-credentials: false
          # Deliberately NOT the check job's fetch-depth/fetch-tags pair. No
          # guard here reads a tag, and a full clone is time this job spends
          # before it can even start pulling images. The asymmetry is stated
          # rather than smoothed over: it is one job's requirement, not a
          # repository-wide setting.

      # Started before the toolchain, and deliberately without --wait: pulling
      # the pinned images and cold-booting the CSMS (SteVe's healthcheck allows
      # 150s for Flyway; CitrineOS runs its migrations on a cold database)
      # shares nothing with installing bun, so the two may as well overlap. The
      # blocking wait below is then usually already satisfied.
      - name: Start the CSMS
        run: docker compose -f drivers/${{ matrix.driver }}/compose.yaml up -d

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Wait for it to be healthy
        run: docker compose -f drivers/${{ matrix.driver }}/compose.yaml up -d --wait

      - name: Seed the fixtures the scenarios assume
        run: bun bin/ocpp-tck.ts driver provision

      # provision self-verifies, so this cannot realistically go red on its own.
      # It is here to exercise the `verify` verb itself -- the one a user runs
      # when a sweep fails and they need to know whether to blame the CSMS or
      # the fixtures. A verb nothing runs is a verb that rots.
      - name: Environment matches the scenarios
        run: bun bin/ocpp-tck.ts driver verify

      # The whole sweep, on every event -- pull requests included.
      #
      # An earlier draft ran only --group core on PRs to save time. Measured,
      # that trade is bad: these scenarios are dominated by fixed waits
      # (bootWaitSecs + holdSecs), not by CPU, so the cost is predictable and
      # barely moves with runner speed. Across 3 lanes, core is ~3 min and all
      # 44 are ~10 min. Roughly 7 minutes buys back the 29 scenarios that core
      # leaves out -- on precisely the branch where a regression is introduced,
      # and for a job whose entire reason to exist is that these drivers cannot
      # rot green. Cheap coverage is not worth a stale signal.
      #
      # --retry-failed-isolated is not optional here: the runner warns that
      # parallel lanes are not fully isolated, so a bare --parallel turns
      # cross-lane interference into a red build. The retry re-runs only the
      # failures, sequentially, which is the mode the runner calls reliable.
      #
      # `bun run e2e`, not the command it wraps, so CI and a human run the same
      # thing and the two lanes cannot drift apart either. A full sweep used to
      # be TWO invocations -- `all` was 44 scenarios and the authorize group
      # (TC_023) sat outside it -- and that fact lived only in this file, so
      # anyone running `run-all` by hand got 44/47, read "no failures", and
      # missed exactly the three scenarios that prove `driver provision` seeded
      # anything. "authorize" is folded into "all" now (see the GROUPS registry
      # in tck/main.ts), so one invocation is the whole suite and the trap is
      # gone rather than documented.
      - name: Conformance sweep
        run: bun run e2e

      # The CSMS's OWN log, which no run of this project has ever captured.
      # `results/` is the charge-point side of the wire, so a CSMS answering
      # `CALLERROR -- InternalError` tells us an exception was raised and never
      # which one: the stack trace behind it lives here and nowhere else. That
      # gap is what left a full investigation of a reproducible flake unable to
      # say whether the cause was the CSMS, the container's resources, or this
      # suite (see the issue this step closes).
      #
      # A RED ROW, not a red job -- and the difference is the whole point.
      # `if: failure()` was the first shape and it missed the one case this
      # capture exists for: a parallel FAIL whose isolated retry passes is a
      # flake, standingOf() calls it "ok", the sweep exits 0 and the job is
      # GREEN. The CALLERROR worth explaining happened inside exactly that. Of
      # 34 archived SteVe sweeps, 20 had a red row; almost all were green jobs.
      #
      # So the trigger reads the summary, with the job's own status kept for
      # the failures that never get as far as writing one. Still nothing on a
      # clean sweep: that was the right half of the first shape -- megabytes
      # nobody reads, in an artifact downloaded in bulk when mining the archive.
      # Into results/ so the existing upload carries it; a second
      # upload-artifact step would be a second retention policy to keep in step.
      - name: Capture the CSMS log when any scenario went red
        if: always()
        run: |
          # mkdir -p: a sweep that died before writing its first scenario log
          # leaves no results/ at all, and the redirect below would then fail
          # for a reason that has nothing to do with the CSMS.
          mkdir -p results
          # THE READING LIVES IN tools/summary-red-rows.ts, not here. It used to
          # be a `grep` on this line, bound to the `cert16-` namespace and to
          # the verdict being the third column, and a line of YAML is a line no
          # test can reach: the only way to learn what it matched was to run a
          # sweep. tests/summary-red-rows.sh now holds it to both.
          #
          # `|| status=$?` and not a bare call: the default shell is `bash -e`,
          # where "no red row" -- a non-zero status by design, so this reads the
          # way the `grep -q` it replaces did -- would abort the step.
          status=0
          bun tools/summary-red-rows.ts results/summary.md || status=$?
          if [ "$status" -eq 1 ] && [ "${{ job.status }}" = success ]; then
            echo "no red row and the job is green -- nothing worth capturing"
            exit 0
          fi
          docker compose -f drivers/${{ matrix.driver }}/compose.yaml logs \
            --no-color --timestamps > results/csms-${{ matrix.driver }}.log
          wc -l results/csms-${{ matrix.driver }}.log
          # Status 2 is a summary the repository could not read, which captures
          # above (a log nobody needed costs a file; a log nobody took costs the
          # investigation) and is worth a red of its OWN only when the job is
          # otherwise green. A failed sweep has already reported, and the
          # commonest way to reach 2 is that it died before writing a table at
          # all -- which the `mkdir -p` above exists for and is not a defect.
          if [ "$status" -gt 1 ] && [ "${{ job.status }}" = success ]; then
            exit 1
          fi

      # always(): the wire logs are worth most precisely when the sweep failed.
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ocpp-tck-${{ matrix.driver }}-results-${{ github.run_id }}
          path: results/
          if-no-files-found: warn

      - name: Tear down
        if: always()
        run: docker compose -f drivers/${{ matrix.driver }}/compose.yaml down -v
